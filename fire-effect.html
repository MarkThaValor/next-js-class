<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fire {
            position: relative;
            width: 94px;
            height: 94px;
        }

        .flame {
            position: absolute;
            inset: 0;
            width: 40px;
            transform-origin: center bottom;
        }

        .flame-1 {
            animation: swirl1 0.9s infinite ease-in-out;
        }

        .flame-2 {
            opacity: 0.25;
            animation: swirl2 1.2s infinite ease-in-out;
        }

        .flame-3 {
            opacity: 0.15;
            animation: swirl3 1.5s infinite ease-in-out;
        }

        @keyframes swirl1 {

            0%,
            100% {
                transform: rotate(-3deg) scale(1);
            }

            50% {
                transform: rotate(5deg) scaleX(0.94) scaleY(1.06);
            }
        }

        @keyframes swirl2 {

            0%,
            100% {
                transform: translateX(-2px) rotate(4deg) scale(0.98);
            }

            50% {
                transform: translateX(3px) rotate(-5deg) scale(1.03);
            }
        }

        @keyframes swirl3 {

            0%,
            100% {
                transform: translateY(1px) rotate(-5deg);
            }

            50% {
                transform: translateY(-4px) rotate(6deg);
            }
        }
    </style>
</head>

<body>
    <div class="fire" onclick="alert('There is fire on the mountain')">
        <span id="name"></span>
        <!-- <img src="./public/icons8-fire-94.png" class="flame flame-1">
        <img src="./public/icons8-fire-94.png" class="flame flame-2">
        <img src="./public/icons8-fire-94.png" class="flame flame-3"> -->
    </div>


    <script>
        const fire = document.querySelector('.fire');
        const name = document.getElementById("name");
        let age = 10;
        name.innerHTML = `Mark has ${(age > 9) ? "many" : "few"} years experience`;

        function flicker() {
            const scale = 0.97 + Math.random() * 0.07;
            const rotate = -2 + Math.random() * 4;
            const y = -2 + Math.random() * 5;

            fire.style.transform = `
        translateY(${y}px)
        rotate(${rotate}deg)
        scale(${scale})
    `;

            setTimeout(flicker, 80 + Math.random() * 180);
        }

        flicker();
    </script>
</body>

</html>
